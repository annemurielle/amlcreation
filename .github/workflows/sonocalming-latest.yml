name: SonoCalming latest 4 long videos

on:
  schedule:
    # Every hour, at minute 23 UTC. Scheduled workflows can run late.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# The site's existing deployment workflow uses the same group.
# Avoid simultaneous commits and deployments when schedules overlap.
concurrency:
  group: aml-store-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Read YouTube uploads and exclude Shorts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/update_sonocalming_latest.py

      - name: Commit a changed feed only
        id: changes
        shell: bash
        run: |
          git add SonoCalming/latest-videos.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new videos, no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-update SonoCalming latest long videos"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish using existing Update game store information workflow
        # A manual test also publishes even if the feed is unchanged.
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This repository deploys via actions/deploy-pages, not branch-based Pages builds.
          # A workflow_dispatch made using GITHUB_TOKEN may trigger another workflow.
          gh workflow run update-game-stats.yml \
            --ref "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}"
          echo "Deployment workflow dispatched. Check 'Update game store information' in Actions."
