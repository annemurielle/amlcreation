name: SonoCalming latest 4 long videos

on:
  schedule:
    # Once daily at 04:23 UTC (05:23 Swiss winter, 06:23 Swiss summer).
    # Separate from the game-store workflow at 05:23 UTC.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# The site's existing deployment workflow uses the same group.
# Avoid simultaneous commits and deployments when schedules overlap.
concurrency:
  group: aml-store-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Refresh latest videos, catalogue, pages and sitemaps
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/update_sonocalming_latest.py

      - name: Refresh SonoCalming on-site SEO (existing and new pages)
        run: python3 tools/update_sonocalming_seo.py

      - name: Correct VideoObject uploadDate using YouTube publication times
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/fix_video_upload_dates.py

      - name: Rebuild SonoCalming galleries in all 8 languages
        run: python3 tools/update_sonocalming_galleries.py

      - name: Refresh AML Creation homepage latest SonoCalming card
        run: python3 tools/update_home_sonocalming.py

      - name: Refresh global canonical and language sitemaps
        run: python3 tools/update_sitemaps.py

      - name: Validate SEO metadata and local sitemaps before publishing
        run: python3 tools/audit_site_seo.py

      - name: Commit only changed SonoCalming files
        id: changes
        shell: bash
        run: |
          git add sitemap.xml sitemap-pages.xml sitemap-sections.xml Games/sitemap.xml lumenmine/sitemap.xml \
            Somnifox/sitemap.xml MahjongCastle/sitemap.xml ZenCircle/sitemap.xml \
            index.html fr/index.html de/index.html es/index.html it/index.html pt/index.html ru/index.html ja/index.html \
            SonoCalming/ Games/ Somnifox/ MahjongCastle/ ZenCircle/ lumenmine/
          git add SonoCalming/video-upload-dates.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes, no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-update SonoCalming catalogue, pages and sitemaps"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish using existing Update game store information workflow
        # A manual test also publishes even if the feed is unchanged.
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This repository deploys via actions/deploy-pages, not branch-based Pages builds.
          # A workflow_dispatch made using GITHUB_TOKEN may trigger another workflow.
          gh workflow run update-game-stats.yml \
            --ref "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}"
          echo "Deployment workflow dispatched. Check 'Update game store information' in Actions."
