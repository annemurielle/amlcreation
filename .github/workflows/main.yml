name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master  # Branche à surveiller pour les modifications.

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Build And Deploy
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_ISLAND_0A5CDDD10 }}
        repo_token: ${{ secrets.GITHUB_TOKEN }} # Ceci est le token par défaut ajouté par Actions.
        action: "upload"
        app_location: "/"  # Localisation de votre application (root).
        output_location: "/"  # Localisation des fichiers générés.
